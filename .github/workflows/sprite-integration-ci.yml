name: Sprite isolated integration tests
on:
  push:
    branches: [fix/sprite-production-bidding-20261124]
  pull_request:
    paths:
      - '**.mjs'
      - 'migrations/**'
      - '.github/workflows/sprite-integration-ci.yml'
permissions:
  contents: read
jobs:
  node-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Sprite-only Node regression tests
        run: node --test tests/*.test.mjs
