name: Sprite synthetic verification

on:
  push:
    branches:
      - fix/sprite-council-low-bid-preflight-20261122
      - fix/sprite-low-bids-budget-proof-20261122
      - fix/sprite-discovery-optional-escrow-20261121
      - fix/sprite-3298-safe-resubmit-sim-20261122
      - fix/sprite-3298-readonly-probe-20261122
      - fix/sprite-uncertain-bid-reconciliation-20261122
      - fix/sprite-nova-evidence-review-sim-20261122
      - fix/sprite-recovery-canary-tests-20261122
  workflow_dispatch:

concurrency:
  group: sprite-synthetic-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout Sprite-only source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Static syntax check
        run: |
          node --check council-preflight.mjs
          node --check council-release.mjs
          node --check low-bid-triage.mjs
      - name: Complete synthetic test suite
        run: node --test tests/*.test.mjs
